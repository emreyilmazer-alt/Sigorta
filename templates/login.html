<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaymak Sigorta Yönetim Girişi</title><style>body{font:16px Arial;background:#f5f3eb;padding:30px}.box{max-width:420px;margin:8vh auto;background:white;padding:25px;border-radius:14px;border:1px solid #ddd}label{display:block;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box}button{margin-top:18px;padding:12px;background:#163d2b;color:white;border:0;border-radius:7px;width:100%;font-weight:bold}.flash{color:#9a2828}</style></head><body><div class="box"><h2>Kaymak Sigorta</h2><h3>Yönetim paneli girişi</h3>{% with messages = get_flashed_messages() %}{% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><label>Kullanıcı adı</label><input name="username" autocomplete="username" required><label>Şifre</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">Giriş yap</button></form></div></body></html>
